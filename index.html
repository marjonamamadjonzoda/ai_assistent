 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой ИИ-ассистент</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .chat-box {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        input,
        button {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Мой персональный ИИ-ассистент</h1>
    <div class="chat-box" id="chatBox">
        <div>Ассистент: Привет! Чем могу помочь?</div>
    </div>
    <input
        type="text"
        id="userInput"
        placeholder="Задайте вопрос..."
        style="width: 70%;"
    >
    <button onclick="sendMessage()">Отправить</button>
    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const message = input.value.trim();
            if (!message) {
                return;
            }
            // Показываем сообщение пользователя
            chatBox.innerHTML += `<div><b>Вы:</b> ${message}</div>`;
            // Очищаем поле
            input.value = "";
            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: message
                    })
                });
                const data = await response.json();
                // Показываем ответ ассистента
                chatBox.innerHTML += `<div><b>Ассистент:</b> ${data.answer}</div>`;
                // Прокручиваем чат вниз
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML +=
                    `<div><b>Ошибка:</b> Не удалось получить ответ от сервера.</div>`;
                console.error(error);
            }
        }
        // Отправка по Enter
        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
